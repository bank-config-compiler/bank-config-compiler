[project]
name = "bank-config-compiler"
version = "0.1.0"
description = "Phase0 PoC runtime for validated bank configuration compiler artifacts."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.0,<3",
    "openpyxl>=3.1.5,<4",
    "python-dotenv>=1.1,<2",
    "pyyaml>=6.0.3,<7",
]

[project.scripts]
bank-config-compiler = "bank_config_compiler.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
tmp_path_retention_count = "3"
tmp_path_retention_policy = "failed"
